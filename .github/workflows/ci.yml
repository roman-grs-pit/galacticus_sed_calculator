name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q

  build-and-smoke-test:
    name: Build and catalog smoke test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and optional dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m pip install -e ".[dev,scripts,diagnostics]"
      - name: Build wheel and source distribution
        run: python -m build
      - name: Verify wheel installation
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -c "import galacticus_sed_calculator"
      - name: Calculate a magnitude from the example lightcone
        run: >-
          python scripts/calculate_catalog_magnitudes.py
          data/romanUNIT.hdf5
          data/nodePropertyExtractorSED_Nt50_NZ11_ageMinimum0.001.hdf5
          --max-galaxies 1
          --filters F158
          --save-to-file "${RUNNER_TEMP}/magnitudes.hdf5"
          --no-check-existing
